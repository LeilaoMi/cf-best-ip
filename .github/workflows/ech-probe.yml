name: ECH Probe

# 带 ECH 实测池中每个 IPv4，把 ok / restricted / unknown 上报到 Worker 的
# POST /api/ech-report。只上报，不部署、不改 DNS。
on:
  schedule:
    - cron: "45 */6 * * *" # Worker cron 在 :15 刷新池子，30 分钟后探测
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只打印汇总，不上报"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ech-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/ech-probe
    env:
      ECH_SENTINELS: ${{ vars.ECH_SENTINELS }} # 为空时用程序默认值
      ECH_REPORT_TOKEN: ${{ secrets.ECH_REPORT_TOKEN }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable # go.mod 要求 >= 1.24；用当前受支持的稳定版
          cache: false       # 仅标准库，没有 go.sum
      - name: Check secret
        if: env.DRY_RUN != 'true'
        run: |
          if [ -z "$ECH_REPORT_TOKEN" ]; then
            echo "::error title=ECH_REPORT_TOKEN missing::请在仓库 Settings → Secrets and variables → Actions 添加 secret ECH_REPORT_TOKEN（与 Worker secret 同值），或手动运行时勾选 dry_run。"
            exit 1
          fi
      - name: Test
        run: go vet ./... && go test ./...
      - name: Probe
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(-dry-run); fi
          set +e
          go run . "${args[@]}" 2>&1 | tee probe.log
          status=${PIPESTATUS[0]}
          set -e
          {
            echo '### ECH probe'
            echo '```'
            grep -E '^(probing|done in|restricted IPs|  [0-9]|report accepted|dry-run|error|warn|note)' probe.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
