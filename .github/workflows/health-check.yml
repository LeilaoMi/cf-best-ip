name: Health Check

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check cf-best-ip health
        run: |
          set -euo pipefail
          url="https://bestip.leilaomi.cc.cd/health"
          attempts=3
          sleep_seconds=30
          last_body=""
          last_code="000"

          for i in $(seq 1 "$attempts"); do
            echo "Attempt $i/$attempts: $url"
            # -D headers.txt to capture CF-RAY / content-type for diagnostics.
            # Custom UA avoids default curl UA being challenged by Cloudflare Bot Fight Mode.
            response="$(curl -sS --max-time 20 -D /tmp/health_headers.txt \
              -A "cf-best-ip-health-check/1.0 (+https://github.com/LeilaoMi/cf-best-ip)" \
              -H "Accept: application/json" \
              -w '\n%{http_code}' "$url" || printf '\n000')"
            last_code="$(printf '%s' "$response" | tail -n1)"
            last_body="$(printf '%s' "$response" | sed '$d')"
            echo "HTTP code: $last_code, body bytes: $(printf '%s' "$last_body" | wc -c)"
            echo "--- response headers ---"
            cat /tmp/health_headers.txt 2>/dev/null || echo "(no headers captured)"
            echo "--- body preview (first 2000 chars) ---"
            printf '%s' "$last_body" | head -c 2000; echo
            echo "--- end preview ---"
            # Diagnostic pretty-print, but never fail the step here:
            # old script did bare `jq .` with `set -o pipefail`, so any non-JSON
            # (Cloudflare challenge / 530 error code:1016 / WAF block) killed the
            # job with `jq: parse error ... exit 5` before retries could run.
            printf '%s\n' "$last_body" | jq . || echo "::warning::Response is not JSON (HTTP $last_code), continuing to retry logic"

            if [ "$last_code" -ge 200 ] && [ "$last_code" -lt 300 ] && printf '%s\n' "$last_body" | jq -e '.ok == true' >/dev/null 2>&1; then
              ok=$(printf '%s\n' "$last_body" | jq -r '.sourceHealth.ok // 0')
              total=$(printf '%s\n' "$last_body" | jq -r '.sourceHealth.total // 0')
              failed=$(printf '%s\n' "$last_body" | jq -r '.sourceHealth.failed // 0')
              echo "Healthy: HTTP $last_code, sources $ok/$total ok, $failed failed"
              exit 0
            fi

            status="$(printf '%s\n' "$last_body" | jq -r '.status // "unknown"' 2>/dev/null || echo unknown)"
            reasons="$(printf '%s\n' "$last_body" | jq -cr '.reasons // []' 2>/dev/null || echo '[]')"
            echo "Not healthy yet: HTTP $last_code, status=$status, reasons=$reasons"
            if [ "$i" -lt "$attempts" ]; then
              sleep "$sleep_seconds"
            fi
          done

          ok=$(printf '%s\n' "$last_body" | jq -r '.sourceHealth.ok // 0' 2>/dev/null || echo 0)
          total=$(printf '%s\n' "$last_body" | jq -r '.sourceHealth.total // 0' 2>/dev/null || echo 0)
          failed=$(printf '%s\n' "$last_body" | jq -r '.sourceHealth.failed // 0' 2>/dev/null || echo 0)
          status="$(printf '%s\n' "$last_body" | jq -r '.status // "unknown"' 2>/dev/null || echo unknown)"
          reasons="$(printf '%s\n' "$last_body" | jq -cr '.reasons // []' 2>/dev/null || echo '[]')"
          echo "Final health: HTTP $last_code, status=$status, reasons=$reasons, sources $ok/$total ok, $failed failed"
          echo "--- final body preview (first 2000 chars) ---"
          printf '%s' "$last_body" | head -c 2000; echo
          echo "--- end preview ---"

          if [ "$total" -gt 0 ]; then
            threshold=$(( total * 60 / 100 ))
            [ "$failed" -le "$threshold" ] || { echo "::error::Too many sources failed: $failed/$total"; exit 1; }
          fi

          echo "::error::Health check failed after $attempts attempts: HTTP $last_code status=$status reasons=$reasons"
          exit 1
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe health endpoint with different clients
        run: |
          set -uo pipefail
          url="https://bestip.leilaomi.cc.cd/health"
          echo "=== 1. curl default UA ==="
          curl -sS --max-time 20 -D /tmp/h1.txt -o /tmp/b1.txt -w 'HTTP %{http_code}, bytes %{size_download}\n' "$url" || echo "curl exit $?"
          head -c 300 /tmp/b1.txt; echo
          grep -i -E "content-type|server|cf-ray" /tmp/h1.txt || true
          echo "=== 2. curl browser UA ==="
          curl -sS --max-time 20 -D /tmp/h2.txt -o /tmp/b2.txt -w 'HTTP %{http_code}, bytes %{size_download}\n' -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36" -H "Accept: application/json" "$url" || echo "curl exit $?"
          head -c 300 /tmp/b2.txt; echo
          grep -i -E "content-type|server|cf-ray" /tmp/h2.txt || true
          echo "=== 3. node fetch browser UA ==="
          URL="$url" node -e '(async () => { try { const r = await fetch(process.env.URL, {headers: {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126.0 Safari/537.36", "Accept": "application/json"}}); const t = await r.text(); console.log("HTTP " + r.status + ", bytes " + t.length); console.log("content-type: " + r.headers.get("content-type")); console.log(t.slice(0, 500)); } catch (e) { console.log("fetch error: " + e.message); } })();' || true
